services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: jobagent-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free # Strictly enforcing constraints
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobagent-db
          property: connectionString
      - key: PYTHONPATH
        value: "."

  # 2. React Frontend (Static Site)
  - type: web
    name: jobagent-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    # Note: Using standard Web Service for static to ensure easy configuration, 
    # but could be changed to `type: static` if routing requires it.

  # 3. LangGraph Workflow Execution (Cron Job)
  - type: cron
    name: jobagent-cron
    env: python
    schedule: "*/30 * * * *" # Every 30 minutes
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python scripts/run_cron.py"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobagent-db
          property: connectionString
      - key: PYTHONPATH
        value: "."

databases:
  # 4. Managed PostgreSQL
  - name: jobagent-db
    databaseName: jobagent
    user: admin
    plan: free
